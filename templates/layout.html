<!DOCTYPE html>
<html lang="{% block lang %}en{% end %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f0e9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23171711'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='monospace' font-size='24' font-weight='700' fill='%23dff551'%3ESR%3C/text%3E%3C/svg%3E">
  <title>{% block title %}Showrun{% end %}</title>
  {% block head_extra %}{% end %}
</head>
<body>
  <a class="skip-link" href="#page-content">Skip to content</a>
  <main id="main">
    <div id="page-content">
      {% block content %}{% end %}
    </div>
  </main>
</body>
</html>
