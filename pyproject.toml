[project]
name = "showrun"
version = "0.1.0"
description = "Turn agent runs into shows people can learn from"
requires-python = ">=3.14"
dependencies = [
  "bengal-chirp[auth,data-pg,forms,markdown,sessions]>=0.10,<0.11",
  "kida-templates>=0.12,<0.13",
  "patitas[syntax]>=0.4,<0.5",
]

[project.scripts]
showrun = "showrun.cli:main"
sr = "showrun.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.0",
  "ruff>=0.15",
  "ty>=0.0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["showrun"]
